<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple notes application built with HTML, CSS, and JavaScript.">
  <title>QuickNotes</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>
  <main class="container">
    <header class="page-header">
      <h1>QuickNotes</h1>
      <p>Keep your thoughts organized, one note at a time.</p>
    </header>

    <section class="notes-section" aria-labelledby="notes-heading">
      <div class="section-heading">
        <h2 id="notes-heading">Your Notes</h2>
        <button id="load-btn" type="button">Load notes</button>
      </div>

      <p id="status" role="status" aria-live="polite">
        Click "Load notes" to fetch notes from the server.
      </p>

      <ul id="notes-list" aria-label="Notes list"></ul>
    </section>

    <section class="form-section" aria-labelledby="form-heading">
      <h2 id="form-heading">Create a Note</h2>

      <form id="note-form">
        <div class="form-group">
          <label for="title-input">Title</label>
          <input
            id="title-input"
            name="title"
            type="text"
            maxlength="100"
            required
            placeholder="Enter your note title"
          >
        </div>

        <div class="form-group">
          <label for="body-input">Note body (optional)</label>
          <textarea
            id="body-input"
            name="body"
            rows="5"
            placeholder="Write your thoughts here..."
          ></textarea>
        </div>

        <button id="submit-btn" type="submit">Create note</button>
      </form>
    </section>
  </main>
</body>
</html>
