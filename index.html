<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="QuickNotes helps you create, view, and manage your notes."
  >
  <title>QuickNotes | Your Notes, Simply Organized</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>
  <header>
    <h1>QuickNotes</h1>
    <p>Your notes, simply organized.</p>
  </header>

  <main>
    <section aria-labelledby="create-heading">
      <h2 id="create-heading">Create a Note</h2>
      <p>Add a title and write down what's on your mind.</p>

      <form id="note-form">
        <div>
          <label for="title-input">Note title</label>
          <input
            type="text"
            id="title-input"
            name="title"
            maxlength="100"
            placeholder="Enter a note title"
            required
          >
        </div>

        <div>
          <label for="body-input">Note content</label>
          <textarea
            id="body-input"
            name="body"
            rows="5"
            placeholder="Write your note here..."
          ></textarea>
        </div>

        <button type="submit" id="submit-btn">Save Note</button>
      </form>
    </section>

    <section aria-labelledby="notes-heading">
      <div>
        <h2 id="notes-heading">Your Notes</h2>
        <p>View and manage your saved notes below.</p>
      </div>

      <button type="button" id="load-btn">Load Notes</button>

      <p id="status" role="status" aria-live="polite">
        Select "Load Notes" to view your notes.
      </p>

      <ul id="notes-list" aria-label="Your notes"></ul>
    </section>
  </main>

  <footer>
    <p>QuickNotes — Keep your thoughts organized.</p>
  </footer>
</body>
</html>
